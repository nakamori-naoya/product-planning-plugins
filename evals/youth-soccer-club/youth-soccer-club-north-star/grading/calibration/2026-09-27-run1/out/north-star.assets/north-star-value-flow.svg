<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">代表から、連絡が一人に集まらずに回るクラブまで価値が届く流れ</title>
  <desc id="desc">連絡の窓口を担う代表、変更と問い合わせが代表の個人の LINE に集まる状態、全員が見に行く一か所を保つプロダクトの役割、代表が一人で受けて配り直さずに済むという価値、誰が代表でも連絡が回る状態のつながりを示す図。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; fill: #172033; }
    .heading { font-size: 30px; font-weight: 700; }
    .node-title { font-size: 24px; font-weight: 700; }
    .body { font-size: 19px; }
    .anchor-text { font-size: 21px; font-weight: 700; fill: #ffffff; }
    .arrow-head { fill: #53627a; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path class="arrow-head" d="M0 0L12 6L0 12Z" fill="#53627a"/>
    </marker>
  </defs>

  <rect width="1500" height="500" rx="28" fill="#f7f8fa"/>
  <text x="750" y="62" text-anchor="middle" class="heading">連絡の行き先を代表一人から、全員が見に行く一か所へ移す</text>

  <g text-anchor="middle">
    <rect x="45" y="145" width="250" height="170" rx="20" fill="#edf2ff" stroke="#2f579c" stroke-width="3"/>
    <text x="170" y="198" class="node-title" fill="#2f579c">対象</text>
    <text x="170" y="245" class="body">連絡の窓口を</text>
    <text x="170" y="272" class="body">担う代表</text>

    <rect x="335" y="145" width="250" height="170" rx="20" fill="#fff0ed" stroke="#8b321f" stroke-width="3"/>
    <text x="460" y="198" class="node-title" fill="#8b321f">損なわれた状態</text>
    <text x="460" y="245" class="body">変更と問い合わせが</text>
    <text x="460" y="272" class="body">代表の個人の LINE へ</text>

    <rect x="625" y="145" width="250" height="170" rx="20" fill="#fff7e6" stroke="#7c520c" stroke-width="3"/>
    <text x="750" y="198" class="node-title" fill="#7c520c">プロダクトの役割</text>
    <text x="750" y="245" class="body">予定の確定版と変更を</text>
    <text x="750" y="272" class="body">全員が見る一か所に</text>

    <rect x="915" y="145" width="250" height="170" rx="20" fill="#e8f5ee" stroke="#155d39" stroke-width="3"/>
    <text x="1040" y="198" class="node-title" fill="#155d39">約束する価値</text>
    <text x="1040" y="245" class="body">一人で受けて</text>
    <text x="1040" y="272" class="body">配り直さずに済む</text>

    <rect x="1205" y="145" width="250" height="170" rx="20" fill="#e8f5ee" stroke="#155d39" stroke-width="3"/>
    <text x="1330" y="198" class="node-title" fill="#155d39">望む状態</text>
    <text x="1330" y="245" class="body">誰が代表でも</text>
    <text x="1330" y="272" class="body">連絡が一人に集まらない</text>
  </g>

  <path d="M295 230H322" stroke="#53627a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M585 230H612" stroke="#53627a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M875 230H902" stroke="#53627a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1165 230H1192" stroke="#53627a" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="300" y="375" width="900" height="64" rx="32" fill="#172033"/>
  <text x="750" y="416" text-anchor="middle" class="anchor-text">代表が試合の日にコーチとしてグラウンドに立てる</text>
</svg>
