<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">変更の行き先という弱い環から、記録と学習へつながる行動の鎖</title>
  <desc id="desc">確定版を一か所に置くことが、変更と車の穴を一か所で回すことを可能にし、4週間の記録と理由の聞き取りを診断と前の行動へ戻す流れの図。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; fill: #172033; }
    .heading { font-size: 30px; font-weight: 700; }
    .node-title { font-size: 25px; font-weight: 700; }
    .body { font-size: 20px; }
    .caption { font-size: 21px; font-weight: 700; fill: #155d39; }
    .note { font-size: 20px; fill: #53627a; }
    .arrow-head { fill: #53627a; }
    .return-head { fill: #247a4b; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path class="arrow-head" d="M0 0L12 6L0 12Z" fill="#53627a"/>
    </marker>
    <marker id="return-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path class="return-head" d="M0 0L12 6L0 12Z" fill="#247a4b"/>
    </marker>
  </defs>

  <rect width="1400" height="560" rx="28" fill="#f7f8fa"/>
  <text x="700" y="62" text-anchor="middle" class="heading">行動の鎖は、前の成果が次を可能にする</text>
  <text x="700" y="110" text-anchor="middle" class="note">まず到達する状態：変更がどこへ届き、穴を誰が埋め、なぜ個人の LINE を選ぶのかが分かっている</text>

  <rect x="55" y="155" width="270" height="170" rx="20" fill="#fff0ed" stroke="#b6452f" stroke-width="3"/>
  <text x="190" y="205" text-anchor="middle" class="node-title" fill="#8b321f">弱い環</text>
  <text x="190" y="250" text-anchor="middle" class="body">変更が一か所へ</text>
  <text x="190" y="280" text-anchor="middle" class="body">出るか確かめていない</text>

  <rect x="395" y="155" width="270" height="170" rx="20" fill="#edf2ff" stroke="#4169b2" stroke-width="3"/>
  <text x="530" y="205" text-anchor="middle" class="node-title" fill="#2f579c">最初の行動</text>
  <text x="530" y="250" text-anchor="middle" class="body">確定版を一か所に置き</text>
  <text x="530" y="280" text-anchor="middle" class="body">出し先を一度だけ頼む</text>

  <rect x="735" y="155" width="270" height="170" rx="20" fill="#edf2ff" stroke="#4169b2" stroke-width="3"/>
  <text x="870" y="205" text-anchor="middle" class="node-title" fill="#2f579c">次の行動</text>
  <text x="870" y="250" text-anchor="middle" class="body">変更と車の穴を</text>
  <text x="870" y="280" text-anchor="middle" class="body">一か所で回す</text>

  <rect x="1075" y="155" width="270" height="170" rx="20" fill="#e8f5ee" stroke="#247a4b" stroke-width="3"/>
  <text x="1210" y="205" text-anchor="middle" class="node-title" fill="#155d39">記録と学習</text>
  <text x="1210" y="250" text-anchor="middle" class="body">日ごとの記録と</text>
  <text x="1210" y="280" text-anchor="middle" class="body">送った理由を聞く</text>

  <path d="M325 240H382" stroke="#53627a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M665 240H722" stroke="#53627a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1005 240H1062" stroke="#53627a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1210 325V415Q1210 455 1170 455H570Q530 455 530 415V340" fill="none" stroke="#247a4b" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#return-arrow)"/>
  <text x="870" y="490" text-anchor="middle" class="caption">分かった事実を診断と確定版の置き方へ戻す</text>
</svg>
